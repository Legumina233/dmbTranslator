<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 340px;
      margin: 0;
      padding: 10px 12px 12px;
      font: 12px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 12px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
    h1 button { margin-left: auto; }
    .status { padding: 5px 8px; border-radius: 5px; font-weight: 600; margin-bottom: 8px; }
    .status-ok { background: rgba(48, 164, 108, 0.16); }
    .status-warn { background: rgba(196, 122, 42, 0.18); }
    .status-off { background: rgba(127, 127, 127, 0.15); opacity: 0.85; }
    .group { border: 1px solid rgba(127,127,127,0.25); border-radius: 6px; padding: 6px 8px 4px; margin-bottom: 8px; }
    .group-title { font-size: 10px; font-weight: 700; opacity: 0.65; margin-bottom: 3px; letter-spacing: 0.04em; }
    .row { display: flex; justify-content: space-between; padding: 1px 0; }
    .row .label { opacity: 0.72; }
    .row .value { font-weight: 700; font-variant-numeric: tabular-nums; }
    .value.warn { color: #c47a2a; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: 1px 4px; font-weight: normal; }
    th { font-size: 10px; opacity: 0.6; border-bottom: 1px solid rgba(127,127,127,0.25); }
    td:first-child, th:first-child { text-align: left; }
    .note { font-size: 10.5px; opacity: 0.75; margin: 6px 0 0; }
    button {
      font: inherit; font-size: 11px; padding: 3px 10px; cursor: pointer;
      border: 1px solid rgba(127,127,127,0.4); border-radius: 5px; background: transparent; color: inherit;
    }
    button:hover { border-color: currentColor; }
    button:disabled { opacity: 0.5; cursor: default; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>M4 预取探针
    <button id="refresh" type="button">刷新</button>
    <button id="copy" type="button" class="hidden">复制 JSON</button>
  </h1>
  <div id="status" class="status status-off">读取中…</div>
  <div id="detail" class="hidden">
    <div class="group">
      <div class="group-title">预取链（showpage JSON）</div>
      <div class="row"><span class="label">当前页</span><span class="value" id="lastPage">—</span></div>
      <div class="row"><span class="label">最远已到页</span><span class="value" id="farthest">—</span></div>
      <div class="row"><span class="label">已入库 JSON</span><span class="value" id="known">—</span></div>
      <div class="row"><span class="label">已请求 / 收到</span><span class="value" id="reqrecv">—</span></div>
    </div>
    <div class="group">
      <div class="group-title">直连通道（api.php）</div>
      <div class="row"><span class="label">showkey</span><span class="value" id="showkey">—</span></div>
      <div class="row"><span class="label">成功 / 失败</span><span class="value" id="okfail">—</span></div>
      <div class="row"><span class="label">排队中</span><span class="value" id="pending">—</span></div>
    </div>
    <div class="group">
      <div class="group-title">翻译执行（后台管线）</div>
      <div class="row"><span class="label">已派发 / 在跑</span><span class="value" id="subact">—</span></div>
      <div class="row"><span class="label">排队页数</span><span class="value" id="queued">—</span></div>
      <div class="row"><span class="label">跳过（忙/无图/窗外）</span><span class="value" id="skips">—</span></div>
    </div>
    <div class="group">
      <div class="group-title">变化时间线（新 → 旧，最多 12 条 / 共 <span id="histTotal">0</span>）</div>
      <table>
        <thead><tr><th>时间</th><th>请求</th><th>收到</th><th>派发</th><th>在跑</th></tr></thead>
        <tbody id="timeline"></tbody>
      </table>
    </div>
    <div class="group">
      <div class="group-title">层叠体检（画框 vs 翻译按钮）</div>
      <div class="row"><span class="label">画框</span><span class="value" id="stOverlay">—</span></div>
      <div class="row"><span class="label">按钮锚点</span><span class="value" id="stAnchor">—</span></div>
      <div class="row"><span class="label">按钮内容</span><span class="value" id="stAnchorContent">—</span></div>
      <div class="row"><span class="label">画框矩形</span><span class="value" id="stOverlayRect">—</span></div>
      <div class="row"><span class="label">按钮矩形</span><span class="value" id="stAnchorRect">—</span></div>
      <div class="note" id="stVerdict">—</div>
      <div class="note hidden" id="stChains"></div>
    </div>
    <p class="note">判读：翻页后「请求/收到/派发」应增长；译好的页翻过去画框直接出译图。本探针只读正式扩展的遥测，测完直接移除本扩展即可。</p>
  </div>
  <div id="offline" class="hidden">
    <p class="note" id="offlineReason"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
